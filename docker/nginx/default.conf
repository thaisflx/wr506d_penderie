# ⚠️ CONFIGURATION RÉSERVÉE AU DOCKER LOCAL, À NE JAMAIS UTILISER EN PRODUCTION ⚠️
# Tests e2e (Cypress) : une requête qui porte l'en-tête "X-Penderie-Env: test" est traitée par Symfony
# en environnement test (APP_ENV=test), donc sur la base penderie_db_test chargée avec les fixtures test.
# Sans cet en-tête, rien ne change (environnement dev, base penderie_db).
# En production, n'importe qui pourrait envoyer cet en-tête et passer l'application en mode test (debug).
map $http_x_penderie_env $penderie_app_env {
    default "";
    test    test;
}

server {
    listen 80;
    server_name localhost;
    root /var/www/backend/public;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass backend:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        # Voir l'avertissement en tête de fichier (if_not_empty : rien n'est envoyé sans l'en-tête)
        fastcgi_param APP_ENV $penderie_app_env if_not_empty;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }
}
